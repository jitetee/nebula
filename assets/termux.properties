# nebula — Termux layout + extra keys
# Linked into ~/.termux/termux.properties. Apply changes with:  termux-reload-settings   (or: keys reload)
# Needs Termux 0.118 or newer (macros and swipe-up popups). Run `keys` for a cheat sheet.

use-black-ui = true

# Session shortcuts
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1

# Extra keys: 4 rows x 10. Swipe a key UP to get the small second key shown on it.
#   Row 1  ESC  /  -  |  _  *  $  ~ (`)  & (;)  ^C (^Z)
#   Row 2  TAB  CTRL  ALT  LEFT  DOWN  UP  RIGHT  "  '  ^D
#   Row 3  HOME  END  PGUP  PGDN  hist  file  dir  clr  KEYBOARD  BKSP
#   Row 4  VOL- VOL+ MUTE BRT- BRT+ TORCH lock  ( )  [ ]  { }     (hardware keys need the Termux:API app)
# Nebula macros: hist = Ctrl-R history search (swipe: help) · file = Ctrl-T pick a file
#                dir = Alt-C pick a folder and cd (swipe: cd ..) · clr = clear screen (swipe: status)
extra-keys = [ \
  ['ESC', '/', '-', '|', '_', '*', '$', \
   {key: '~', popup: '`'}, \
   {key: '&', popup: ';'}, \
   {macro: 'CTRL c', display: '^C', popup: {macro: 'CTRL z', display: '^Z'}}], \
  ['TAB', 'CTRL', 'ALT', 'LEFT', 'DOWN', 'UP', 'RIGHT', '"', "'", \
   {macro: 'CTRL d', display: '^D'}], \
  ['HOME', 'END', 'PGUP', 'PGDN', \
   {macro: 'CTRL r', display: 'hist', popup: {macro: 'h e l p ENTER', display: 'help'}}, \
   {macro: 'CTRL t', display: 'file'}, \
   {macro: 'ALT c', display: 'dir', popup: {macro: '. . ENTER', display: 'cd ..'}}, \
   {macro: 'CTRL l', display: 'clr', popup: {macro: 's t a t u s ENTER', display: 'stat'}}, \
   'KEYBOARD', 'BKSP'], \
  [{macro: 'ALT 1', display: 'VOL-'}, \
   {macro: 'ALT 2', display: 'VOL+'}, \
   {macro: 'ALT 3', display: 'MUTE'}, \
   {macro: 'ALT 4', display: 'BRT-'}, \
   {macro: 'ALT 5', display: 'BRT+'}, \
   {macro: 'ALT 6', display: 'TORCH'}, \
   {macro: 'ALT 7', display: 'lock'}, \
   {key: '(', popup: ')'}, \
   {key: '[', popup: ']'}, \
   {key: '{', popup: '}'}] \
]
