# nebula — Termux layout + extra keys
# Linked into ~/.termux/termux.properties. Apply changes with:  termux-reload-settings   (or: keys reload)
# Needs Termux 0.118 or newer (macros and swipe-up popups). Run `keys` for a cheat sheet.

use-black-ui = true

# Session shortcuts
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1

# Extra keys: 3 rows x 8 (24 buttons). Swipe a button UP for the second key shown in brackets.
#   Row 1  VOL+ (BRT+)  VOL- (BRT-)  PGUP (HOME)  CTRL (^C)  TAB (hist)  ALT (dir)  * (&)  - (_)
#   Row 2  MUTE (torch)  UP (clr)  PGDN (END)  ESC (keyboard)  / (file)  | (')  { ([)  $ (()
#   Row 3  RIGHT  DOWN  LEFT  BKSP (")  ~ (`)  } (])  ENTER (lock)  ) (;)
# VOL/BRT/torch need the Termux:API app. hist = Ctrl-R · dir = Alt-C (pick a folder) · file = Ctrl-T · clr = clear screen.
extra-keys = [ \
  [{macro: 'ALT 2', display: 'VOL+', popup: {macro: 'ALT 5', display: 'BRT+'}}, \
   {macro: 'ALT 1', display: 'VOL-', popup: {macro: 'ALT 4', display: 'BRT-'}}, \
   {key: 'PGUP', popup: 'HOME'}, \
   {key: 'CTRL', popup: {macro: 'CTRL c', display: '^C'}}, \
   {key: 'TAB', popup: {macro: 'CTRL r', display: 'hist'}}, \
   {key: 'ALT', popup: {macro: 'ALT c', display: 'dir'}}, \
   {key: '*', popup: '&'}, \
   {key: '-', popup: '_'}], \
  [{macro: 'ALT 3', display: 'MUTE', popup: {macro: 'ALT 6', display: 'TORCH'}}, \
   {key: 'UP', popup: {macro: 'CTRL l', display: 'clr'}}, \
   {key: 'PGDN', popup: 'END'}, \
   {key: 'ESC', popup: 'KEYBOARD'}, \
   {key: '/', popup: {macro: 'CTRL t', display: 'file'}}, \
   {key: '|', popup: "'"}, \
   {key: '{', popup: '['}, \
   {key: '$', popup: '('}], \
  ['RIGHT', 'DOWN', 'LEFT', \
   {key: 'BKSP', popup: '"'}, \
   {key: '~', popup: '`'}, \
   {key: '}', popup: ']'}, \
   {key: 'ENTER', popup: {macro: 'ALT 7', display: 'lock'}}, \
   {key: ')', popup: ';'}] \
]
