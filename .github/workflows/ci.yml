name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          for f in bin/nebula lib/*.sh install/*.sh motd/*.sh; do bash -n "$f" || exit 1; done
      - name: nvim lua syntax
        run: |
          sudo apt-get install -y lua5.4 >/dev/null
          for f in $(find assets/nvim -name '*.lua'); do luac5.4 -p "$f" || exit 1; done
      - name: font loads and has the Nebula icons
        run: |
          pip install -q fonttools
          python3 -c "from fontTools.ttLib import TTFont; f=TTFont('assets/fonts/nebula.ttf'); c=f.getBestCmap(); assert all(0xE400+i in c for i in range(6)) and all(x in c for x in (0x2714,0x2716,0x2717,0x26A0,0x2139,0x27A4,0x25B8,0x2605)), 'missing icons'; print(f['name'].getDebugName(1))"
      - name: nvim UI uses only glyphs the font has
        run: |
          python3 - <<'PY'
          import glob
          from fontTools.ttLib import TTFont
          cm = TTFont('assets/fonts/nebula.ttf').getBestCmap()
          bad = []
          for f in glob.glob('assets/nvim/**/*.lua', recursive=True):
              for c in set(open(f, encoding='utf-8').read()):
                  if ord(c) > 127 and ord(c) not in cm: bad.append((f, c, hex(ord(c))))
          assert not bad, bad
          PY
      - name: consistency (help everywhere) + core tests
        run: |
          sudo apt-get install -y neovim >/dev/null
          bash lib/check.sh
          bash tools/test-core.sh
      - name: screens fit a phone (56 columns)
        run: |
          pip install -q pyte
          python3 tools/gallery.py --check --cols 56
      - name: python compile
        run: python3 -m compileall -q lib apps
      - name: rules are valid JSON
        run: python3 -c "import json;json.load(open('docs/database.rules.json'))"
      - name: shared look smoke test
        run: |
          printf '1\t\tHello\tWorld\n' | NEBULA_HOME=$PWD python3 lib/skin.py menu --title Test | grep -q Hello
          NEBULA_HOME=$PWD python3 lib/skin.py banner NEBULA --tag test | grep -q "╔"
      - name: bundled .jif files validate
        run: |
          shopt -s nullglob
          files=(apps/jtlearn/data/jif/*.jif)
          if (( ${#files[@]} == 0 )); then echo "no bundled .jif files (they are optional)"; exit 0; fi
          for f in "${files[@]}"; do python3 apps/jtlearn/jif_tool.py validate "$f" || exit 1; done
      - name: help renders
        run: NEBULA_HOME=$PWD HOME=$(mktemp -d) bash bin/nebula --help | grep -q Commands
