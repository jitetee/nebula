name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          for f in bin/nebula lib/*.sh install/*.sh motd/*.sh; do bash -n "$f" || exit 1; done
      - name: python compile
        run: python3 -m compileall -q lib apps
      - name: rules are valid JSON
        run: python3 -c "import json;json.load(open('docs/database.rules.json'))"
      - name: shared look smoke test
        run: |
          printf '1\t\tHello\tWorld\n' | NEBULA_HOME=$PWD python3 lib/skin.py menu --title Test | grep -q Hello
          NEBULA_HOME=$PWD python3 lib/skin.py banner NEBULA --tag test | grep -q "╔"
      - name: bundled .jif files validate
        run: |
          for f in apps/jtlearn/data/jif/*.jif; do python3 apps/jtlearn/jif_tool.py validate "$f" || exit 1; done
      - name: help renders
        run: NEBULA_HOME=$PWD HOME=$(mktemp -d) bash bin/nebula --help | grep -q Commands
